name: Handle Project Initialization
# Fires when the template is instantiated via the initial repository push
on:
  push:
    branches:
      - main
      - master

# Needed to push the renamed files back. Note: GITHUB_TOKEN can never modify files under
# .github/workflows/ regardless of permissions granted here — that requires a PAT with the
# 'workflow' scope, which isn't viable for a public template (each instantiation lacks the secret).
# So this workflow does not attempt to delete itself; it self-guards to a no-op on subsequent runs.
permissions:
  contents: write

jobs:
  rename-project:
    if: github.repository != 'ginjaninja1/EmbyTemplatev2'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Dynamically Rename Architecture
      run: |
        set -euo pipefail

        OLD_NAME="EmbyTemplatev2"
        RAW_NAME="${{ github.event.repository.name }}"

        # Idempotency guard: if the template source dir is already gone, this has run before
        if [ ! -d "src/$OLD_NAME" ]; then
          echo "src/$OLD_NAME not found — rename already applied. Skipping."
          exit 0
        fi

        # Sanitize repo name into a valid C# identifier/project name:
        # strip anything not alphanumeric or underscore, and ensure it doesn't start with a digit
        NEW_NAME=$(echo "$RAW_NAME" | sed 's/[^A-Za-z0-9_]//g')
        if [[ "$NEW_NAME" =~ ^[0-9] ]]; then
          NEW_NAME="_$NEW_NAME"
        fi
        if [ -z "$NEW_NAME" ]; then
          echo "ERROR: repository name '$RAW_NAME' sanitized to empty string, cannot proceed."
          exit 1
        fi

        echo "Renaming template from $OLD_NAME to $NEW_NAME..."

        NEW_GUID=$(uuidgen)
        echo "Generated New Plugin GUID: $NEW_GUID"

        # Only touch text files — skip binaries (dlls, images, etc.) so sed can't corrupt them
        find . -type f -not -path '*/.git/*' -not -path '*/.github/workflows/*' -print0 \
          | while IFS= read -r -d '' f; do
              if grep -Iq . "$f" 2>/dev/null; then
                sed -i "s/$OLD_NAME/$NEW_NAME/g; s/GENERATE_NEW_GUID_HERE/$NEW_GUID/g" "$f"
              fi
            done

        # Rename the project/solution files and source directory
        mv "src/$OLD_NAME/$OLD_NAME.csproj" "src/$OLD_NAME/$NEW_NAME.csproj"
        mv "src/$OLD_NAME/$OLD_NAME.slnx" "src/$OLD_NAME/$NEW_NAME.slnx"
        mv "src/$OLD_NAME" "src/$NEW_NAME"

    - name: Commit Changes to Single Source of Truth
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "automation: dynamically initialized plugin layout and generated unique GUID"
        git push origin HEAD
